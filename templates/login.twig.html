<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!--  This file has been downloaded from bootdey.com @bootdey on twitter -->
    <!--  All snippets are MIT license http://bootdey.com/license -->
    <title>MiniDLNA Database Browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="RequestURI" content="{{ request_uri }}">
    <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/1.7.1/clipboard.min.js"></script>
    <link href="/css/login.css" rel="stylesheet">
</head>
<body>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css" integrity="sha256-2XFplPlrFClt0bIdPgpz8H7ojnk10H69xRqd9+uTShA=" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/4.5.6/css/ionicons.min.css" integrity="sha512-0/rEDduZGrqo4riUlwqyuHDQzp2D1ZCgH/gFIfjMIL5az8so6ZiXyhf1Rg8i6xsjv+z/Ubc4tt1thLigEcu6Ug==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<div class="container-fluid flex-grow-1 light-style container-p-y">
    <div class="container-m-nx container-m-ny bg-lightest mb-3">
        <form class="form-signin" method="POST" action="/login">
            <img class="mb-4" src="/images/minidlna-browser-php_logo_300x85.png" alt="" width="300" height="85">
            <h1 class="h3 mb-3 font-weight-normal">{{ login_please }}</h1>
            <label for="username" class="sr-only">{{ username_label }}</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="{{ username_placeholder }}" required autofocus>
            <label for="password" class="sr-only">{{ password_label }}</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="{{ password_placeholder }}" required>
            <input type="hidden" id="return_uri" name="return_uri" value="{{ return_uri }}" >
{% if alert_danger %}
            <div class="alert alert-danger alert-dismissable">
                    <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
                    {{ alert_danger }}
            </div>
{% endif %}

            <button class="btn btn-lg btn-primary btn-block" type="submit">{{ btn_login_text }}</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2025-{{ "now"|date("Y") }} GNa</p>
        </form>
    </div>
</div>
</body>
</html>
